name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (commit, branch, or tag) to build
        required: true
        type: string
      android_variant:
        description: Android variant (Debug, Profile, or signed Release)
        type: string
        default: Debug
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
    outputs:
      pkg_version:
        description: Build version
        value: ${{ jobs.source.outputs.pkg_version }}

permissions:
  contents: read

jobs:
  source:
    name: Create source package
    runs-on: ubuntu-latest
    outputs:
      pkg_version: ${{ steps.version.outputs.pkg_version }}
    steps:
    - name: Clone tree
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
      with:
        fetch-depth: 0
        ref: ${{ inputs.ref }}
        persist-credentials: false
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y meson zstd
    - name: Determine release version
      id: version
      run: |
        if TAG=$(git describe --tags --match 'v*' 2>/dev/null); then
          echo "pkg_version=${TAG#v}" >> $GITHUB_OUTPUT
        else
          SHORT_HASH=$(git rev-parse --short HEAD)
          echo "pkg_version=0.0.0-0-unofficial-${SHORT_HASH}" >> $GITHUB_OUTPUT
        fi
    - name: Create source package
      id: package
      env:
        PKG_VERSION: ${{ steps.version.outputs.pkg_version }}
      run: |
        pkg_name="xemu-${PKG_VERSION}"
        tar_filename="${pkg_name}.tar"
        tar_prefix="./${pkg_name}/"
        ./scripts/archive-source.sh "${tar_filename}" "${tar_prefix}"

        git rev-parse HEAD > XEMU_COMMIT
        printf '%s' "${PKG_VERSION}" > XEMU_VERSION
        tar -r --file "${tar_filename}" --transform "s,^./,${tar_prefix}," ./XEMU_COMMIT ./XEMU_VERSION

        zstd "${tar_filename}"
        echo "pkg_filename=${tar_filename}.zst" >> $GITHUB_OUTPUT
    - name: Upload source package artifact
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
      with:
        name: src
        path: ${{ steps.package.outputs.pkg_filename }}
        compression-level: 0

  android:
    name: Android
    uses: ./.github/workflows/build-android.yml
    with:
      ref: ${{ inputs.ref }}
      variant: ${{ inputs.android_variant }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  linux:
    name: Linux
    needs: source
    uses: ./.github/workflows/build-linux.yml
    with:
      pkg_version: ${{ needs.source.outputs.pkg_version }}

  macos:
    name: macOS
    needs: source
    uses: ./.github/workflows/build-macos.yml
    with:
      pkg_version: ${{ needs.source.outputs.pkg_version }}

  windows:
    name: Windows
    needs: source
    uses: ./.github/workflows/build-windows.yml
    with:
      pkg_version: ${{ needs.source.outputs.pkg_version }}
