name: Build xemu-win64-toolchain

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish toolchain images to this fork's GHCR namespace
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/build-xemu-win64-toolchain.yml'
      - 'ubuntu-win64-cross/**'
  pull_request:
    paths:
      - '.github/workflows/build-xemu-win64-toolchain.yml'
      - 'ubuntu-win64-cross/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  build-image:
    name: Build Image (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        toolchain: [llvm, gcc]
    steps:
      - name: Clone tree
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          persist-credentials: false
      - name: Prepare image name and build space
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}-win64-toolchain-${TOOLCHAIN}" >> "$GITHUB_ENV"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=xemu-win64-toolchain-${{ matrix.toolchain }}
            org.opencontainers.image.description=${{ matrix.toolchain }} toolchain and libraries for building xemu Windows releases
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch }}
            type=ref,event=branch
            type=sha
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v5
        with:
          context: ubuntu-win64-cross
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          file: ubuntu-win64-cross/${{ matrix.toolchain }}.Dockerfile
          build-args: JOBS=2
          cache-from: type=gha,scope=win64-${{ matrix.toolchain }}
          cache-to: type=gha,mode=min,scope=win64-${{ matrix.toolchain }}
