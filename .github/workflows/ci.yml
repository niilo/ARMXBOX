name: CI

on:
  pull_request:
  push:
    branches:
      - '**'
    tags-ignore:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-versioning:
    name: Check Android release versioning
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
      with:
        persist-credentials: false
    - run: python3 .github/scripts/test-android-release.py

  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
