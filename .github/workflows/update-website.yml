name: Update Website

on:
  workflow_call:
    secrets:
      WEBSITE_TOKEN:
        description: Token allowed to dispatch workflows in WEBSITE_REPOSITORY
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update_website:
    runs-on: ubuntu-latest
    env:
      WEBSITE_REPOSITORY: ${{ vars.WEBSITE_REPOSITORY }}
      WEBSITE_REF: ${{ vars.WEBSITE_REF || 'master' }}
      WEBSITE_WORKFLOW: ${{ vars.WEBSITE_WORKFLOW || 'build.yml' }}
      GH_TOKEN: ${{ secrets.WEBSITE_TOKEN }}
    steps:
    - name: Trigger website update
      run: |
        if [ -z "$WEBSITE_REPOSITORY" ] || [ -z "$GH_TOKEN" ]; then
          echo '::notice::Website integration is disabled. Configure WEBSITE_REPOSITORY and WEBSITE_TOKEN to enable it.'
          exit 0
        fi
        gh workflow run "$WEBSITE_WORKFLOW" --repo "$WEBSITE_REPOSITORY" --ref "$WEBSITE_REF"
