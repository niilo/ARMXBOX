name: Pre-release

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  release:
    name: Pre-release
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ github.sha }}
      tag: pre-release
      pre-release: true
