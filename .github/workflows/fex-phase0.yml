name: FEX Phase 0 diagnostic
on:
  push:
    branches: ['experiment/fex-hle-runtime']
    paths: ['experiments/fex-runtime/**', '.github/workflows/fex-phase0.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
      - name: Check reference CPU tables
        run: |
          python3 experiments/fex-runtime/scripts/generate-xbox-cpuid.py --check
          python3 experiments/fex-runtime/scripts/generate-xbox-instructions.py --check
      - name: Prepare pinned engine
        run: python3 experiments/fex-runtime/scripts/prepare.py "$RUNNER_TEMP/FEX"
      - name: Configure host simulator
        run: >-
          cmake -S experiments/fex-runtime -B "$RUNNER_TEMP/fex-host" -G Ninja
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Release -DARMXBOX_HOST_SIMULATOR=ON
          -DFEX_SOURCE_DIR="$RUNNER_TEMP/FEX"
      - name: Build and run generated ARM64 fixtures
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$RUNNER_TEMP/fex-host" --target armxbox_fex_selftest armxbox_abi_witness_test armxbox_division_native_test armxbox_fault_policy_test armxbox_host_arena_test armxbox_trace_test armxbox_code_buffer_test armxbox_xbe_image_test armxbox_guest_reservation_test -j 2
          timeout 30s "$RUNNER_TEMP/fex-host/armxbox_guest_reservation_test" | tee "$RUNNER_TEMP/fex-guest-reservation.txt"
          timeout 30s "$RUNNER_TEMP/fex-host/armxbox_xbe_image_test" "$RUNNER_TEMP/generated-controlled.xbe" | tee "$RUNNER_TEMP/fex-xbe-image.txt"
          python3 experiments/fex-runtime/scripts/check-controlled-xbe.py "$RUNNER_TEMP/generated-controlled.xbe" | tee "$RUNNER_TEMP/fex-xbe-reference.txt"
          timeout 30s "$RUNNER_TEMP/fex-host/armxbox_code_buffer_test" | tee "$RUNNER_TEMP/fex-code-buffer.txt"
          timeout 30s "$RUNNER_TEMP/fex-host/armxbox_trace_test" | tee "$RUNNER_TEMP/fex-trace.txt"
          timeout 30s "$RUNNER_TEMP/fex-host/armxbox_abi_witness_test" "$RUNNER_TEMP/fex-host/abi_witness.bin" | tee "$RUNNER_TEMP/fex-abi-witness.txt"
          timeout 30s "$RUNNER_TEMP/fex-host/armxbox_fault_policy_test" | tee "$RUNNER_TEMP/fex-fault-policy.txt"
          timeout 30s "$RUNNER_TEMP/fex-host/armxbox_division_native_test" | tee "$RUNNER_TEMP/fex-division-native.txt"
          for run in 1 2 3 4 5; do
            timeout 30s "$RUNNER_TEMP/fex-host/armxbox_host_arena_test" > "$RUNNER_TEMP/fex-arena-$run.txt" 2> "$RUNNER_TEMP/fex-arena-$run-stderr.txt"
          done
          ARMXBOX_PROBE_SINGLE_BLOCK=1 timeout 120s "$RUNNER_TEMP/fex-host/armxbox_fex_selftest" 2> "$RUNNER_TEMP/fex-fixtures-single-stderr.txt" | tee "$RUNNER_TEMP/fex-fixtures-single.txt"
          timeout 120s "$RUNNER_TEMP/fex-host/armxbox_fex_selftest" 2> "$RUNNER_TEMP/fex-fixtures-stderr.txt" | tee "$RUNNER_TEMP/fex-fixtures.txt"
          ARMXBOX_PROBE_XBE_HINT_ONLY=1 timeout 120s "$RUNNER_TEMP/fex-host/armxbox_fex_selftest" 2> "$RUNNER_TEMP/fex-fixtures-hint-stderr.txt" | tee "$RUNNER_TEMP/fex-fixtures-hint.txt"
      - name: Capture host failure backtrace
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          if ! command -v gdb >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq gdb
          fi
          for target in armxbox_host_arena_test armxbox_fex_selftest; do
            ARMXBOX_PROBE_SINGLE_BLOCK=1 timeout 120s gdb --batch \
              -ex 'set pagination off' -ex 'set disable-randomization off' \
              -ex run -ex 'thread apply all bt' --args "$RUNNER_TEMP/fex-host/$target" \
              > "$RUNNER_TEMP/fex-$target-backtrace.txt" 2>&1 || true
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: fex-phase0-host-report
          path: |
            ${{ runner.temp }}/fex-guest-reservation.txt
            ${{ runner.temp }}/fex-xbe-image.txt
            ${{ runner.temp }}/fex-xbe-reference.txt
            ${{ runner.temp }}/generated-controlled.xbe
            ${{ runner.temp }}/fex-code-buffer.txt
            ${{ runner.temp }}/fex-trace.txt
            ${{ runner.temp }}/fex-fixtures.txt
            ${{ runner.temp }}/fex-abi-witness.txt
            ${{ runner.temp }}/fex-division-native.txt
            ${{ runner.temp }}/fex-fixtures-single.txt
            ${{ runner.temp }}/fex-fixtures-hint.txt
            ${{ runner.temp }}/fex-fault-policy.txt
            ${{ runner.temp }}/fex-arena-*.txt
            ${{ runner.temp }}/fex-fixtures*-stderr.txt
            ${{ runner.temp }}/fex-*-backtrace.txt
          if-no-files-found: ignore
  android-diagnostic:
    needs: cpu-fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0 ndk;30.0.15729638'
      - name: Check reference CPU tables
        run: |
          python3 experiments/fex-runtime/scripts/generate-xbox-cpuid.py --check
          python3 experiments/fex-runtime/scripts/generate-xbox-instructions.py --check
      - name: Prepare pinned engine
        run: python3 experiments/fex-runtime/scripts/prepare.py "$RUNNER_TEMP/FEX"
      - name: Compile and link the full Android core
        run: |
          cmake -S experiments/fex-runtime -B "$RUNNER_TEMP/fex-android" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/30.0.15729638/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release -DFEX_SOURCE_DIR="$RUNNER_TEMP/FEX"
          cmake --build "$RUNNER_TEMP/fex-android" --target armxbox_fex_link_probe armxbox_fex_diagnostic -j 2
      - name: Package isolated diagnostic APK
        env:
          FEX_SOURCE_DIR: ${{ runner.temp }}/FEX
        run: bash experiments/fex-runtime/scripts/package-apk.sh "$RUNNER_TEMP/fex-android" "$RUNNER_TEMP/fex-apk"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: armxbox-fex-phase0.11.1-debug
          path: |
            ${{ runner.temp }}/fex-apk/armxbox-fex-phase0.11.1-debug.apk
            ${{ runner.temp }}/fex-apk/assets/THIRD_PARTY_NOTICES
          if-no-files-found: error
          retention-days: 30
