name: Build for Android

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: true
        type: string
      variant:
        description: Android variant (Debug, Profile, or signed Release)
        default: Debug
        type: string
      test_build_name:
        description: Optional label for a testing APK and launcher
        default: ''
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      variant:
        description: Android variant (Release requires signing secrets)
        default: Debug
        type: choice
        options: [Debug, Profile, Release]
      test_build_name:
        description: Optional test label (for example rc15-control)
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Android (${{ matrix.host }}, ${{ inputs.variant || 'Debug' }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux
            runner: ubuntu-22.04
            output: build
          - host: macos
            runner: macos-15
            output: build-macos
    env:
      RUSTUP_TOOLCHAIN: stable
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
      VARIANT: ${{ inputs.variant || 'Debug' }}
      TEST_BUILD_NAME: ${{ inputs.test_build_name || '' }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12'
      - name: Prepare release signing
        if: env.VARIANT == 'Release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 .github/scripts/android-signing.py prepare
      - name: Install native build tools
        shell: bash
        run: |
          python -m pip install meson ninja tomli pyyaml
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android --toolchain stable
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0 ndk;30.0.15729638 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - name: Cache downloaded dependencies
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cargo/registry
            ~/.cargo/git
          key: android-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/**/Cargo.lock') }}
          restore-keys: android-${{ runner.os }}-
      - name: Build Android packages
        shell: bash
        run: |
          case "$VARIANT" in Debug|Profile|Release) ;; *) echo 'Unsupported Android variant' >&2; exit 1 ;; esac
          if [ -n "$TEST_BUILD_NAME" ] && ! [[ "$TEST_BUILD_NAME" =~ ^[a-z0-9][a-z0-9-]{0,47}$ ]]; then
            echo 'Invalid test build label' >&2; exit 1
          fi
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          tasks=("assemble${VARIANT}")
          if [ "$VARIANT" = Release ]; then tasks+=(bundleRelease); fi
          revision=$(git rev-parse HEAD)
          ./android/gradlew -p android --no-daemon "${tasks[@]}" \
            "-Pxemu.testBuildName=$TEST_BUILD_NAME" "-Pxemu.sourceRevision=$revision"
      - name: Verify release signatures
        if: env.VARIANT == 'Release'
        env:
          OUTPUT_DIR: ${{ matrix.output }}
        run: |
          python3 .github/scripts/android-signing.py verify \
            "android/app/${OUTPUT_DIR}/outputs/apk/release/app-release.apk" \
            "android/app/${OUTPUT_DIR}/outputs/bundle/release/app-release.aab"
      - name: Name Android packages
        shell: bash
        env:
          OUTPUT_DIR: ${{ matrix.output }}
          BUILD_HOST: ${{ matrix.host }}
        run: |
          variant=$(printf '%s' "$VARIANT" | tr '[:upper:]' '[:lower:]')
          label=${TEST_BUILD_NAME:+-${TEST_BUILD_NAME}}
          mkdir -p dist-android
          cp "android/app/${OUTPUT_DIR}/outputs/apk/${variant}/app-${variant}.apk" \
            "dist-android/x1box-android-${variant}${label}-${BUILD_HOST}.apk"
          if [ "$VARIANT" = Release ]; then
            cp "android/app/${OUTPUT_DIR}/outputs/bundle/release/app-release.aab" \
              "dist-android/x1box-android-release${label}-${BUILD_HOST}.aab"
          fi
      - name: Remove release signing files
        if: always() && env.VARIANT == 'Release'
        run: python3 .github/scripts/android-signing.py cleanup
      - name: Upload Android packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: x1box-android-${{ matrix.host }}-${{ inputs.variant || 'Debug' }}
          path: |
            dist-android/*.apk
            dist-android/*.aab
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
